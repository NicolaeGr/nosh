# Generated by nosh on first start. Edit freely.
#
# A menu is one view plus one source. The full field reference is in
# docs/features/menus.md. More menus can live here or in a drop-in file such
# as ~/.config/nosh/menus.d/wallpapers.toml. Each drop-in is a full file with
# its own schema line and one or more [menu.<id>] tables.

schema = 1

[menu.apps]
title = "Applications"
placeholder = "Search applications"

[menu.apps.window]
namespace = "nosh-menu-apps"
anchors = ["center"]
layer = "overlay"
keyboard = "exclusive"
width = 560
height = 275

[menu.apps.view]
type = "grid"
columns = 2

[menu.apps.view.item]
layout = "row"

[menu.apps.source]
type = "builtin"
name = "apps"
search = "source"


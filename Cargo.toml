[workspace]
members = ["crates/nosh-core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
bitflags = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libpulse-binding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

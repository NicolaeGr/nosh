# Generated by nosh on first start. Edit freely.
#
# A menu is one view plus one source. The full field reference is in
# docs/features/menus.md. More menus can live here or in a drop-in file such
# as ~/.config/nosh/menus.d/wallpapers.toml. Each drop-in is a full file with
# its own schema line and one or more [menu.<id>] tables.

schema = 1

[menu.apps]
title = "Applications"
placeholder = "Search applications"

# The terminal emulator used by desktop entries with Terminal=true and by the
# reserved "terminal" action. The item's argv is appended after this.
[menu.apps.terminal]
command = ["kitty", "--"]

# In-menu key bindings. The value names an entry in [menu.apps.actions] or the
# reserved "terminal" action.
[menu.apps.keys]
"ctrl+return" = "terminal"

[menu.apps.window]
namespace = "nosh-menu-apps"
anchors = ["center"]
layer = "overlay"
keyboard = "exclusive"
width = 560
height = 275

[menu.apps.view]
type = "grid"
columns = 2

[menu.apps.view.item]
layout = "row"

[menu.apps.source]
type = "builtin"
name = "apps"
search = "source"

# Optional: register a keybind for this menu. The bind is skipped when another
# program already owns the chord, unless forced = true.
[menu.apps.bind]
chord = "SUPER, X"

# A selector for the other menus. hidden keeps it out of its own list;
# show_in_apps puts it in the launcher.
[menu.menus]
title = "Menus"
placeholder = "Search menus"
icon = "view-app-grid-symbolic"
hidden = true
show_in_apps = true

[menu.menus.window]
width = 560
height = 380

[menu.menus.view]
type = "list"

[menu.menus.source]
type = "builtin"
name = "menus"
search = "client"

[menu.menus.bind]
chord = "SUPER, SHIFT, M"

